# Style gate for the audiocraft fork.
#
# flake8 reads the tree, not the runtime, so it needs no torch — which is what
# makes it the one gate here that can actually run. The upstream linter also ran
# mypy, and mypy.ini leaves `torch` off its ignore_missing_imports list, so mypy
# resolves nothing without the full pinned stack (torch 2.1.0 / torchtext 0.16.0
# / xformers on Python 3.9). Same for the pytest suite: importing audiocraft
# imports torch. Both belong to a harness with that environment, not a push gate.
name: Lint
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  flake8:
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages flake8
          python3 -m flake8 audiocraft tests
